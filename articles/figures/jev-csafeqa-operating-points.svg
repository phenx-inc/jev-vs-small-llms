<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" role="img" aria-labelledby="title desc">
<title id="title">Accuracy hid Jev&#x27;s conservative operating point</title>
<desc id="desc">Scatter plot of unsafe recall against safe specificity. Jev has very high specificity but low recall, while trained 4B students detect many more unsafe responses.</desc>
<rect x="0.0" y="0.0" width="1300.0" height="900.0" rx="0.0" fill="#F6F2E9" opacity="1"/>
<text x="70.0" y="68.0" text-anchor="start" fill="#102A3A" font-family="Georgia, serif" font-size="42" font-weight="700">Accuracy hid Jev’s conservative operating point</text>
<text x="70.0" y="108.0" text-anchor="start" fill="#667681" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="400">C-SafeQA at a fixed 0.5 threshold · higher and farther right are better</text>
<line x1="160.0" y1="150.0" x2="160.0" y2="750.0" stroke="#D7DDD9" stroke-width="1" opacity="1"/>
<text x="160.0" y="792.0" text-anchor="middle" fill="#667681" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">85%</text>
<line x1="510.0" y1="150.0" x2="510.0" y2="750.0" stroke="#D7DDD9" stroke-width="1" opacity="1"/>
<text x="510.0" y="792.0" text-anchor="middle" fill="#667681" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">90%</text>
<line x1="860.0" y1="150.0" x2="860.0" y2="750.0" stroke="#D7DDD9" stroke-width="1" opacity="1"/>
<text x="860.0" y="792.0" text-anchor="middle" fill="#667681" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">95%</text>
<line x1="1210.0" y1="150.0" x2="1210.0" y2="750.0" stroke="#D7DDD9" stroke-width="1" opacity="1"/>
<text x="1210.0" y="792.0" text-anchor="middle" fill="#667681" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">100%</text>
<line x1="160.0" y1="750.0" x2="1210.0" y2="750.0" stroke="#D7DDD9" stroke-width="1" opacity="1"/>
<text x="140.0" y="757.0" text-anchor="end" fill="#667681" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">25%</text>
<line x1="160.0" y1="611.5" x2="1210.0" y2="611.5" stroke="#D7DDD9" stroke-width="1" opacity="1"/>
<text x="140.0" y="618.5" text-anchor="end" fill="#667681" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">40%</text>
<line x1="160.0" y1="473.1" x2="1210.0" y2="473.1" stroke="#D7DDD9" stroke-width="1" opacity="1"/>
<text x="140.0" y="480.1" text-anchor="end" fill="#667681" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">55%</text>
<line x1="160.0" y1="334.6" x2="1210.0" y2="334.6" stroke="#D7DDD9" stroke-width="1" opacity="1"/>
<text x="140.0" y="341.6" text-anchor="end" fill="#667681" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">70%</text>
<line x1="160.0" y1="196.2" x2="1210.0" y2="196.2" stroke="#D7DDD9" stroke-width="1" opacity="1"/>
<text x="140.0" y="203.2" text-anchor="end" fill="#667681" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">85%</text>
<text x="685.0" y="842.0" text-anchor="middle" fill="#102A3A" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Safe specificity — correctly accepted safe responses</text>
<text x="36.0" y="450.0" text-anchor="start" fill="#667681" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Unsafe recall</text>
<text x="1198.0" y="184.0" text-anchor="end" fill="#667681" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">ideal</text>
<line x1="984.5" y1="628.0" x2="763.4" y2="354.8" stroke="#5278C7" stroke-width="2" opacity="0.55" stroke-dasharray="8 8"/>
<line x1="984.5" y1="628.0" x2="626.3" y2="256.6" stroke="#5278C7" stroke-width="2" opacity="0.55" stroke-dasharray="8 8"/>
<line x1="984.5" y1="628.0" x2="405.2" y2="200.9" stroke="#5278C7" stroke-width="2" opacity="0.55" stroke-dasharray="8 8"/>
<circle cx="1126.0" cy="670.4" r="14.0" fill="#F26B4A" stroke="#F6F2E9" stroke-width="5"/>
<text x="1108.0" y="652.4" text-anchor="end" fill="#102A3A" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Jev</text>
<circle cx="984.5" cy="628.0" r="11.0" fill="#5278C7" stroke="#F6F2E9" stroke-width="5"/>
<text x="966.5" y="662.0" text-anchor="end" fill="#102A3A" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Qwen 4B base</text>
<circle cx="763.4" cy="354.8" r="12.0" fill="#5278C7" stroke="#F6F2E9" stroke-width="5"/>
<text x="781.4" y="336.8" text-anchor="start" fill="#102A3A" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">4B + Jev</text>
<circle cx="626.3" cy="256.6" r="12.0" fill="#169C82" stroke="#F6F2E9" stroke-width="5"/>
<text x="646.3" y="286.6" text-anchor="start" fill="#102A3A" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">4B + hybrid</text>
<circle cx="405.2" cy="200.9" r="12.0" fill="#7B61A8" stroke="#F6F2E9" stroke-width="5"/>
<text x="385.2" y="178.9" text-anchor="end" fill="#102A3A" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">4B + hard</text>
<circle cx="1028.7" cy="511.3" r="12.0" fill="#B58735" stroke="#F6F2E9" stroke-width="5"/>
<text x="1046.7" y="493.3" text-anchor="start" fill="#102A3A" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">9B + hard</text>
<rect x="250.0" y="662.0" width="430.0" height="78.0" rx="14.0" fill="#EAE4D8" opacity="1"/>
<text x="272.0" y="692.0" text-anchor="start" fill="#F26B4A" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Jev: 33.6% unsafe recall</text>
<text x="272.0" y="721.0" text-anchor="start" fill="#667681" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400">at 98.8% safe specificity</text>
</svg>